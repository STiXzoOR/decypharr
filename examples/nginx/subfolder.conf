# Decypharr Nginx configuration — subfolder mount
#
# Serves Decypharr at https://example.com/decypharr/ with the two API
# surfaces (qBittorrent-compatible at /api/, Sabnzbd-compatible at
# /sabnzbd/api) open to Sonarr/Radarr, and the web UI protected by your
# auth module of choice.
#
# Requires `"url_base": "/decypharr/"` in config.json.

upstream decypharr {
    server 127.0.0.1:8282;
    keepalive 32;
}

# --- Base server block: drop in your TLS, auth, and shared snippets ----------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    include /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/ssl/example.crt;
    ssl_certificate_key /etc/nginx/ssl/example.key;

    # Web UI — protected. Replace with your preferred auth:
    #   auth_basic + auth_basic_user_file        (simple HTTP basic)
    #   auth_request /authelia                   (forward auth)
    #   external SSO in an include file
    location ^~ /decypharr/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }

    # qBittorrent API — open for Sonarr/Radarr's download client
    location ^~ /decypharr/api/ {
        auth_basic   off;
        auth_request off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }

    # Sabnzbd API — open for the Usenet flow
    location ^~ /decypharr/sabnzbd/api {
        auth_basic   off;
        auth_request off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }
}


