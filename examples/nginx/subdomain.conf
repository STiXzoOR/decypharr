# Decypharr Nginx configuration — subdomain mount
#
# Serves Decypharr at https://decypharr.example.com/ with the two API
# surfaces (qBittorrent-compatible at /api/, Sabnzbd-compatible at
# /sabnzbd/api) open to Sonarr/Radarr, and the web UI protected by your
# auth module of choice.
#
# Leave `"url_base"` at its default (`"/"`) in config.json — the subdomain
# layout doesn't need a path prefix.

upstream decypharr {
    server 127.0.0.1:8282;
    keepalive 32;
}

# --- Base server block: drop in your TLS, auth, and shared snippets ----------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name decypharr.example.com;

    include /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/ssl/decypharr.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/decypharr.example.com.key;

    # Web UI — add your auth module here at the server level
    # (auth_basic / auth_request / include).

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }

    # qBittorrent API — override any server-level auth
    location ^~ /api/ {
        auth_basic   off;
        auth_request off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }

    # Sabnzbd API — override any server-level auth
    location ^~ /sabnzbd/api {
        auth_basic   off;
        auth_request off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://decypharr;
    }
}


